[package]
name = "tidelm-text"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tokenizer and the engram compressed token map for the DS v4.1 engine"

[dependencies]
tidelm-core = { path = "../tidelm-core" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# key order is prompt bytes: tools and arguments render in the order the client sent them
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
sha2 = "0.10"

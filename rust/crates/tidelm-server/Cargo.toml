[package]
name = "tidelm-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenAI- and Anthropic-compatible HTTP routes for the Rust engines (server/app.py, server/muse_app.py)"

[dependencies]
tidelm-glm = { path = "../tidelm-glm" }
tidelm-comm = { path = "../tidelm-comm" }
tidelm-core = { path = "../tidelm-core" }
tidelm-cuda = { path = "../tidelm-cuda" }
tidelm-engine = { path = "../tidelm-engine" }
tidelm-text = { path = "../tidelm-text" }
tidelm-image = { path = "../tidelm-image" }
# an image_url that is an http(s) URL (image_processor.load_image_bytes: urlopen)
ureq = "2.12"
# key order is prompt bytes (tool definitions, call arguments) and reply bytes
serde_json = { version = "1", features = ["preserve_order"] }
# /v1/messages: the reasoning memo keys an answer by a digest of its text
sha2 = "0.10"

[build-dependencies]

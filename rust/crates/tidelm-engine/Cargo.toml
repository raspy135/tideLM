[package]
name = "tidelm-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The DS v4.1 engine in Rust: weights, caches, the forward pass and the decode loop"

[dependencies]
tidelm-comm = { path = "../tidelm-comm" }
tidelm-core = { path = "../tidelm-core" }
tidelm-cuda = { path = "../tidelm-cuda" }
tidelm-kernels = { path = "../tidelm-kernels" }
tidelm-model = { path = "../tidelm-model" }
tidelm-text = { path = "../tidelm-text" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "tidelm-generate"
path = "src/bin/generate.rs"

[[bin]]
name = "tidelm-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "tidelm-batch"
path = "src/bin/batch.rs"

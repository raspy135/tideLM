[package]
name = "tidelm-text"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tokenizer and the engram compressed token map for the DS v4.1 engine"

[dependencies]
tidelm-core = { path = "../tidelm-core" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
